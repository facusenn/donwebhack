<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="t">
  <title id="t">El equipo de Peloco: Lucía, Martín y Sofi</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9c4"/><stop offset="1" stop-color="#d9876a"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5532f" stop-opacity=".0"/><stop offset="1" stop-color="#7a3219" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#fondo)"/>
  <!-- espejos del salón -->
  <g fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".5" stroke-width="4">
    <rect x="110" y="40" width="220" height="300" rx="110"/>
    <rect x="490" y="40" width="220" height="300" rx="110"/>
    <rect x="870" y="40" width="220" height="300" rx="110"/>
  </g>
  <rect y="300" width="1200" height="220" fill="url(#piso)"/>

  <!-- Lucía: colorista, pelo largo cobrizo -->
  <g transform="translate(220 0)">
    <path d="M-95 520 C-95 400 -70 350 0 350 C70 350 95 400 95 520Z" fill="#2c3e50"/>
    <path d="M-40 360 L0 450 L40 360Z" fill="#f6f1ea"/>
    <rect x="-16" y="300" width="32" height="55" fill="#e8b48f"/>
    <path d="M-78 250 C-90 150 -40 120 0 120 C40 120 90 150 78 250 L82 380 L-82 380Z" fill="#a8461f"/>
    <ellipse cx="0" cy="240" rx="58" ry="70" fill="#f0c19c"/>
    <path d="M-60 220 C-55 160 -10 150 20 160 C50 170 62 200 60 225 C30 200 -10 205 -60 220Z" fill="#a8461f"/>
    <circle cx="-20" cy="245" r="5" fill="#2b1d16"/><circle cx="22" cy="245" r="5" fill="#2b1d16"/>
    <path d="M-16 275 Q0 290 18 275" stroke="#a33a2b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- pincel de color -->
    <g transform="translate(70 420) rotate(-25)"><rect x="-6" y="-60" width="12" height="70" rx="5" fill="#1f1a17"/><rect x="-9" y="-80" width="18" height="24" rx="4" fill="#c2185b"/></g>
  </g>

  <!-- Martín: barbero, barba -->
  <g transform="translate(600 0)">
    <path d="M-105 520 C-105 395 -75 345 0 345 C75 345 105 395 105 520Z" fill="#1f1a17"/>
    <path d="M-30 350 L0 420 L30 350Z" fill="#b5532f"/>
    <rect x="-18" y="295" width="36" height="55" fill="#c99470"/>
    <ellipse cx="0" cy="235" rx="60" ry="72" fill="#d9a77f"/>
    <path d="M-62 215 C-66 150 -20 130 10 135 C55 140 70 175 62 215 C50 180 -40 175 -62 215Z" fill="#2b1d16"/>
    <path d="M-58 250 C-55 320 -20 335 0 335 C20 335 55 320 58 250 C40 280 -40 280 -58 250Z" fill="#3b2a20"/>
    <circle cx="-22" cy="235" r="5" fill="#2b1d16"/><circle cx="22" cy="235" r="5" fill="#2b1d16"/>
    <path d="M-14 282 Q0 292 14 282" stroke="#f0c19c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- tijera -->
    <g transform="translate(-80 430) rotate(20)" stroke="#e9e3dc" stroke-width="7" fill="none" stroke-linecap="round">
      <circle cx="-12" cy="20" r="11"/><circle cx="12" cy="20" r="11"/><path d="M-6 10 L10 -45 M6 10 L-10 -45"/>
    </g>
  </g>

  <!-- Sofi: estilista, rodete -->
  <g transform="translate(980 0)">
    <path d="M-95 520 C-95 400 -70 352 0 352 C70 352 95 400 95 520Z" fill="#6d4c7d"/>
    <path d="M-36 360 L0 440 L36 360Z" fill="#f6f1ea"/>
    <rect x="-15" y="300" width="30" height="55" fill="#8d5a3b"/>
    <circle cx="0" cy="140" r="38" fill="#1f1410"/>
    <ellipse cx="0" cy="240" rx="56" ry="68" fill="#a86e4a"/>
    <path d="M-58 230 C-62 165 -20 150 0 150 C20 150 62 165 58 230 C45 195 -45 195 -58 230Z" fill="#1f1410"/>
    <circle cx="-20" cy="245" r="5" fill="#1a0f0a"/><circle cx="20" cy="245" r="5" fill="#1a0f0a"/>
    <path d="M-15 274 Q0 288 16 274" stroke="#5a1f1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- secador -->
    <g transform="translate(-75 430) rotate(-15)"><rect x="-30" y="-22" width="60" height="40" rx="20" fill="#f6f1ea"/><rect x="-10" y="10" width="20" height="50" rx="8" fill="#f6f1ea"/><circle cx="-30" cy="-2" r="10" fill="#b5532f"/></g>
  </g>
</svg>
